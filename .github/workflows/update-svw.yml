name: Update svw formula

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-svw.yml
      - script/update-svw-formula.py
  repository_dispatch:
    types: [svw-release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag (`latest` or `release-X.Y.Z`)
        required: true
        default: latest

permissions:
  contents: write

concurrency:
  group: homebrew-tap-svw-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select release tag
        id: release
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${MANUAL_TAG:-latest}}"
          case "$tag" in
            latest|release-[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release tag: $tag" >&2; exit 64 ;;
          esac
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Generate audited formula
        id: formula
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          output=$(python3 script/update-svw-formula.py --tag "$RELEASE_TAG")
          printf '%s\n' "$output"
          formula=$(printf '%s\n' "$output" | sed -n '1p')
          test -f "$formula"
          printf 'path=%s\n' "$formula" >> "$GITHUB_OUTPUT"

      - name: Prepare candidate formula commit
        id: candidate
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name svcomplex-dev
          git config user.email code@svcomplex.ai
          git config core.hooksPath .githooks
          git add Formula
          if git diff --cached --quiet; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "brew: update svw for ${RELEASE_TAG}"
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"

      - name: Install and smoke test formula
        env:
          FORMULA_PATH: ${{ steps.formula.outputs.path }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          formula=$(basename "$FORMULA_PATH" .rb)
          brew tap svcomplex-dev/tap "file://$GITHUB_WORKSPACE"
          brew install "svcomplex-dev/tap/$formula"
          prefix=$(brew --prefix "svcomplex-dev/tap/$formula")
          "$prefix/bin/svw" --version
          "$prefix/bin/svw" --help >/dev/null

      - name: Push tested formula update
        if: steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main
